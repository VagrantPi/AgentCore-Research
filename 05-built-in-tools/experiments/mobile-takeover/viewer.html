<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Live View 接手測試</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 12px system-ui; }
  #status { padding: 6px 10px; }
  #wrap { position: relative; width: 100vw; overflow: hidden; }
  #dcv-display { position: absolute; top: 0; left: 0; transform-origin: top left; }
</style>
</head>
<body>
<div id="status">連線中…</div>
<!-- 手機 Safari 點 DCV canvas 不會取得焦點，按鍵沒地方接；用這個輸入框叫出鍵盤，再把按鍵轉給 DCV -->
<input id="kbd" placeholder="點這裡打字（轉送到遠端瀏覽器）" autocapitalize="off" autocomplete="off" autocorrect="off"
  style="width: calc(100vw - 24px); margin: 0 10px 6px; font-size: 16px; padding: 6px;">
<div id="kbdlog" style="padding: 0 10px 6px;"></div>
<!-- 測試用：模擬輸入法選完字後送出中文（idb 只能送 HID 按鍵，打不了中文） -->
<button id="cjk" style="margin: 0 10px 6px; font-size: 14px;">送出「台北101」（模擬輸入法）</button>
<div id="wrap"><div id="dcv-display"></div></div>
<script type="module">
// 連線流程照抄 hephclaw web/browser-view/dcv-session.mjs：authenticate → connect，firstFrame 才算有畫面
import dcv from '/dcvjs-esm/dcv.js';

const config = await (await fetch('/config')).json();
const report = (name, extra = {}) =>
  fetch('/event', { method: 'POST', body: JSON.stringify({ name, sincePageStartMs: Math.round(performance.now()), ...extra }) });
const status = (text) => { document.getElementById('status').textContent = text; };

const display = document.getElementById('dcv-display');
const fit = (w, h) => {
  const scale = window.innerWidth / w;
  Object.assign(display.style, { width: `${w}px`, height: `${h}px`, transform: `scale(${scale})` });
  document.getElementById('wrap').style.height = `${h * scale}px`;
};
fit(config.width, config.height);

report('page_loaded', { userAgent: navigator.userAgent, secureContext: window.isSecureContext });
const params = () => new URL(config.signedUrl).searchParams;
dcv.setLogLevel(dcv.LogLevel.ERROR);
dcv.authenticate(config.signedUrl, {
  httpExtraSearchParams: params,
  promptCredentials: () => { status('需要帳密（不應發生）'); report('prompt_credentials'); },
  error: (_, e) => { status('驗證失敗'); report('auth_error', { error: String(e?.message ?? e?.code ?? e) }); },
  success: async (_, result) => {
    report('authenticated');
    const auth = result?.[0];
    try {
      const connection = await dcv.connect({
        url: config.signedUrl, sessionId: auth.sessionId, authToken: auth.authToken,
        divId: 'dcv-display',
        baseUrl: new URL('/dcvjs-esm', window.location.origin).href,
        enabledChannels: ['display', 'input'], clipboardAutoSync: false, enableWebCodecs: false,
        observers: {
          httpExtraSearchParams: params,
          firstFrame: () => { status('即時畫面'); report('first_frame'); },
          disconnect: (reason) => { status('已中斷'); report('disconnect', { reason: JSON.stringify(reason) }); },
          displayLayout: (w, h) => { if (w > 0 && h > 0) fit(w, h); },
        },
      });
      report('connected');
      const kbd = document.getElementById('kbd');
      let forwarded = 0;
      for (const type of ['keydown', 'keyup']) {
        kbd.addEventListener(type, (e) => {
          // IME 選字中的按鍵不轉，避免把注音／拼音的中間狀態送過去
          if (e.isComposing || e.keyCode === 229) { report('kbd_composing', { type, key: e.key }); return; }
          const ok = connection.sendKeyboardEvent(e);
          forwarded += 1;
          document.getElementById('kbdlog').textContent = `已轉送 ${forwarded} 個按鍵事件（最後：${e.key}，${ok}）`;
          if (type === 'keyup') report('kbd_forwarded', { key: e.key, ok, forwarded });
          e.preventDefault();
        });
      }
      // 輸入法選完字（compositionend）只拿得到字串，逐字包成按鍵事件轉給 DCV
      // 連續送時第一個中文字會掉（實測「台北101」只剩「北101」），每個事件之間停 gapMs
      const gapMs = Number(new URLSearchParams(location.search).get('gap') ?? 30);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const sendText = async (text, source) => {
        let ok = true;
        for (const ch of text) {
          for (const type of ['keydown', 'keyup']) {
            ok = connection.sendKeyboardEvent(new KeyboardEvent(type, { key: ch })) && ok;
            if (gapMs) await sleep(gapMs);
          }
        }
        report('kbd_text_sent', { text, ok, source });
        document.getElementById('kbdlog').textContent = `已送出文字「${text}」（${ok}）`;
      };
      kbd.addEventListener('compositionend', (e) => { report('kbd_composition_end', { data: e.data }); sendText(e.data, 'ime'); kbd.value = ''; });
      document.getElementById('cjk').addEventListener('click', () => sendText('台北101', 'button'));
    } catch (e) {
      status('連線失敗'); report('connect_error', { error: String(e?.message ?? e?.code ?? e) });
    }
  },
});
</script>
</body>
</html>
